name: Java

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "11"
      - name: Build and test Java binding
        run: |
          cd bindings/java
          make build test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sila-kzg-java-linux-amd64
          path: bindings/java/src/main/resources/sila/ckzg4844/lib/amd64

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "11"
          architecture: aarch64
      - name: Build and test Java binding
        run: |
          cd bindings/java
          make OS_ARCH=aarch64 build test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sila-kzg-java-linux-aarch64
          path: bindings/java/src/main/resources/sila/ckzg4844/lib/aarch64

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "11"
      - name: Build and test arm64 Java binding
        run: |
          cd bindings/java
          make build test
      - name: Build x86_64 native library
        run: |
          cd blst
          ./build.sh -D__BLST_PORTABLE__ -arch x86_64
          cp libblst.a ../lib/
          cd ../bindings/java
          make CC_FLAGS="-target x86_64-apple-macos" OS_ARCH=x86_64 build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sila-kzg-java-macos
          path: bindings/java/src/main/resources/sila/ckzg4844/lib/

  windows-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "11"
      - name: Build and test Java binding
        shell: bash
        run: |
          cd bindings/java
          make build
          ./gradlew.bat clean check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sila-kzg-java-windows-amd64
          path: bindings/java/src/main/resources/sila/ckzg4844/lib/amd64

  assemble:
    needs: [linux-amd64, linux-arm64, macos, windows-amd64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sila-kzg-java-linux-amd64
          path: bindings/java/src/main/resources/sila/ckzg4844/lib/amd64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sila-kzg-java-linux-aarch64
          path: bindings/java/src/main/resources/sila/ckzg4844/lib/aarch64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sila-kzg-java-macos
          path: bindings/java/src/main/resources/sila/ckzg4844/lib/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sila-kzg-java-windows-amd64
          path: bindings/java/src/main/resources/sila/ckzg4844/lib/amd64
      - name: Build universal Sila Java artifact
        run: |
          cd bindings/java
          ./gradlew clean jar
          mv build/libs/c-kzg-4844-jni.jar build/libs/sila-ckzg4844-jni-v2.1.8.jar
      - name: Verify universal Sila artifact
        run: |
          jar_file="bindings/java/build/libs/sila-ckzg4844-jni-v2.1.8.jar"
          jar tf "$jar_file" > /tmp/jar-files.txt
          for expected in \
            sila/ckzg4844/CKZG4844JNI.class \
            sila/ckzg4844/CKZGException.class \
            sila/ckzg4844/CellsAndProofs.class \
            sila/ckzg4844/ProofAndY.class \
            sila/ckzg4844/lib/amd64/libckzg4844jni.so \
            sila/ckzg4844/lib/aarch64/libckzg4844jni.so \
            sila/ckzg4844/lib/amd64/ckzg4844jni.dll \
            sila/ckzg4844/lib/x86_64/libckzg4844jni.dylib \
            sila/ckzg4844/lib/aarch64/libckzg4844jni.dylib
          do
            grep -Fx "$expected" /tmp/jar-files.txt
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sila-ckzg4844-jni-v2.1.8
          path: bindings/java/build/libs/sila-ckzg4844-jni-v2.1.8.jar

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sila-ckzg4844-jni-v2.1.8
          path: release
      - name: Publish Sila Java artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="sila-v2.1.8"
          asset="release/sila-ckzg4844-jni-v2.1.8.jar"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "${{ github.sha }}" --title "Sila KZG Java v2.1.8" --notes "Sila-native Java JNI artifact for c-kzg-4844 v2.1.8."
          fi
          gh release upload "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
